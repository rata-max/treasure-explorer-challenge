<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treasure Explorer Assignment</title><link rel="stylesheet" href="globals.css"><script src="content.js"></script></head><body>
<nav class="nav"><a class="brand" href="index.html"><span>TE</span> TREASURE EXPLORER</a><a class="navCta" href="index.html#schedule">ALL WEEKS →</a></nav>
<main class="assignmentPage"><header class="assignmentHero"><p id="weekLabel"></p><h1 id="weekTitle"></h1><p id="weekTagline"></p><div class="focusTag" id="weekFocus"></div></header>
<section class="assignmentGrid"><article><p class="sectionCode">OBJECTIVES</p><div id="objectives"></div></article><article><p class="sectionCode">DELIVERABLES</p><div id="deliverables"></div></article></section>
<section class="contract"><p class="sectionCode">SUBMISSION CONTRACT</p><h2>Submit one agent.</h2><div class="contractGrid"><div><h3>Technical rules</h3><ul id="submissionRules"></ul></div><div><h3>Academic integrity</h3><ul id="integrityRules"></ul></div></div></section>

<script>const c=window.SITE_CONTENT;const n=Math.min(3,Math.max(1,Number(new URLSearchParams(location.search).get('week'))||1));const w=c.weeks[n-1];document.title=`Week ${w.number} · ${w.title}`;document.getElementById('weekLabel').textContent=`WEEK ${w.number} / ASSIGNMENT`;document.getElementById('weekTitle').textContent=w.title;document.getElementById('weekTagline').textContent=w.tagline;document.getElementById('weekFocus').textContent=w.focus;const list=(id,a)=>document.getElementById(id).innerHTML=a.map(x=>`<div class="numberedItem"><span>✓</span><p>${x}</p></div>`).join('');list('objectives',w.objectives);list('deliverables',w.deliverables);document.getElementById('submissionRules').innerHTML=c.submissionRules.map(x=>`<li>${x}</li>`).join('');document.getElementById('integrityRules').innerHTML=c.integrityRules.map(x=>`<li>${x}</li>`).join('');document.getElementById('evaluationLabel').textContent=w.evaluation.label;document.getElementById('evaluationTitle').textContent=w.evaluation.title;document.getElementById('evaluationText').textContent=w.evaluation.text;</script></body></html>
